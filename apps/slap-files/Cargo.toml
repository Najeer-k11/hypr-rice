[package]
name = "slap-files"
version = "0.5.0"
edition = "2021"
license = "Unlicense"
description = "Slap File Manager: an Explorer-style file manager for Hyprland, themed live from your wallpaper"

[[bin]]
name = "slap-files"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
