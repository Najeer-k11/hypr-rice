[main]
include=~/.config/fuzzel/colors.ini
font=GeistMono Nerd Font:size=11
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=kitty -e
layer=overlay
dpi-aware=no
anchor=center
width=38
lines=9
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=22
letter-spacing=0
image-size-ratio=0
fields=name,generic,keywords,filename
show-actions=no

[border]
width=1
radius=6
