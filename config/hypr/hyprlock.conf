source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, soft
    animation = fadeOut, 1, 5, soft
}

background {
    monitor =
    path = $wallpaper
    color = $surface
    blur_passes = 0
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $on_surface
    font_size = 84
    font_family = GeistMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = $on_surface_variant
    font_size = 16
    font_family = GeistMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    rounding = 6
    dots_size = 0.22
    dots_spacing = 0.4
    outer_color = $primary
    inner_color = $surface
    font_color  = $on_surface
    check_color = $tertiary
    fail_color  = $error
    fade_on_empty = false
    placeholder_text = password
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}

# ---- bottom strip, filled by rice-lockinfo; a label stays empty when there's nothing to show
label {
    monitor =
    text = cmd[update:2000] rice-lockinfo music
    color = $on_surface
    font_size = 12
    font_family = GeistMono Nerd Font
    position = 24, 22
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] rice-lockinfo notifications
    color = $primary
    font_size = 12
    font_family = GeistMono Nerd Font
    position = 0, 22
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:15000] rice-lockinfo battery
    color = $on_surface
    font_size = 12
    font_family = GeistMono Nerd Font
    position = -24, 22
    halign = right
    valign = bottom
}
